apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: finsecure-pay-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: FinSecurePayAlerts
      rules:
        - alert: HighHttp5xxErrorRate
          expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "High HTTP 5xx error rate detected on FinSecure Pay API"
            description: "The FinSecure Pay API is returning HTTP 5xx errors exceeding the threshold."